name: Smoke clone

# Weekly: install + verify on a fresh clone to catch "main is broken"
# before consumers hit it via bun update.

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 9am UTC
  workflow_dispatch:

jobs:
  fresh-clone:
    runs-on: ubuntu-latest
    steps:
      - name: Clone into a fresh dir
        run: |
          mkdir -p /tmp/smoke
          cd /tmp/smoke
          git clone --depth 1 https://github.com/${{ github.repository }}.git launchpad
          cd launchpad
          ls -la

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Install + verify
        working-directory: /tmp/smoke/launchpad
        run: |
          bun install --frozen-lockfile
          bun run verify
